name: CI

on:
  # Push ham, PR ham tekshiriladi.
  #
  # Ilgari bu yerda faqat `main` turardi: feature branchlar PR orqali
  # tekshiriladi deb hisoblangan edi. Lekin `pull_request` hodisasi PR ning
  # MERGE natijasida ishlaydi, ya'ni GitHub avval branchni `main` bilan
  # qo'shib ko'radi. Konflikt chiqsa, bunday merge yasab bo'lmaydi va CI
  # umuman ishga tushmaydi — hech qanday xato ko'rsatilmaydi, shunchaki
  # tekshiruv yo'qoladi. Aynan shunday bo'ldi: konflikt paydo bo'lgach,
  # keyingi commitlar tekshirilmay o'tib ketdi.
  #
  # Push hodisasi merge yasashni talab qilmaydi, shuning uchun u konflikt
  # bo'lganda ham ishlaydi.
  push:
  pull_request:

concurrency:
  # Bitta branch uchun push va pull_request runlari BIR guruhda bo'lishi
  # kerak, aks holda har bir commit CI'ni ikki marta ishga tushiradi.
  # `head_ref` faqat PR da to'ladi, `ref_name` esa push da — natijada
  # ikkalasi ham bir xil nom beradi.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 — ishlab chiqish muhiti, 3.12 — Dockerfile'dagi versiya.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Testlar (pytest)
        run: pytest
        env:
          # Testlar o'z bazasini yasaydi (tests/conftest.py), bu qiymatlar
          # faqat sozlamalar import bo'lishi uchun.
          SECRET_KEY: ci-secret-key-not-for-production
          TIMEZONE: Asia/Tashkent

      - name: Modullar import bo'lishini tekshirish
        run: python -c "from app import bot, main, attendance, payroll, excel, security"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Imijni yig'ish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tabel:ci

      - name: Imij ichida ilova ishga tushishini tekshirish
        run: |
          docker run --rm \
            -e SECRET_KEY=ci-secret-key-not-for-production \
            -e DATABASE_URL=sqlite:////tmp/ci.db \
            tabel:ci python manage.py init
