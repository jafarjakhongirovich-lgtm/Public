# Ishga tushirish:
#   cp .env.example .env   -> .env ni to'ldiring
#   docker compose up -d
#   docker compose run --rm web python manage.py init
#
# Ikkita servis bitta imijdan ishlaydi:
#   web — admin panel va QR ekrani (kiosk)
#   bot — Telegram long polling (domen/HTTPS kerak emas)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tabel
      POSTGRES_USER: tabel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da belgilanishi kerak}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabel -d tabel"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tabel:${POSTGRES_PASSWORD}@db:5432/tabel
    ports:
      # Faqat lokal interfeysga chiqaramiz — tashqariga nginx orqali beriladi.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tabel:${POSTGRES_PASSWORD}@db:5432/tabel
    command: ["python", "-m", "app.bot"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
