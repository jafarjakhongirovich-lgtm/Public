[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  # `class X(str, Enum)` -> `StrEnum` taklifi. Hozirgi ko'rinish SQLAlchemy
  # `Enum()` turi bilan aniq ishlaydi, o'zgartirishning foydasi yo'q.
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI'da `Depends()` ni standart argument sifatida yozish — majburiy idioma.
"app/main.py" = ["B008"]
